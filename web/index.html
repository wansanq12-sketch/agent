<script src="/behavior.js"></script><script src="/input.js"></script><script src="/speech.js"></script><script>
const $=s=>document.querySelector(s),pet=$('#pet');let state,busy=false,dock='',typing=null,fold=null,full='',pending=null,last=Date.now(),attempts=0,lastWave=0,waiting=false,scale=1,replyEmotion='idle',inviteTimer=null,chatRequest=null;

let scheduleQueue=Promise.resolve(),scheduleError='',invitationGeneration=0,invitationSaving=false;

 const task=scheduleQueue.catch(()=>{}).then(()=>api('schedule',value));scheduleQueue=task;

}
function restoreSchedule(){

 const saved=state?.settings?.resume_schedule&&state.schedule;
 if(saved){const now=Date.now();last=Math.min(saved.last||now,now);lastWave=Math.min(saved.lastWave||0,now);attempts=Math.min(2,Math.max(0,saved.attempts||0))}

let activeReminder=null,reminderTimer=null,appliedGameMode=null,gameModeSaving=false;
let lastRegions='';

setInterval(regions,120);

let draftTimer=null,imeActive=false,imeEndedAt=0,imeEnterUntil=0,inputTouched=false;

 clearTimeout(draftTimer);const text=$('#input').value;

 return draftQueue.write(text).then(()=>{persistSchedule().catch(()=>{});if($('#input').value===text)$('#draft-status').textContent=text?'草稿已保存':''}).catch(error=>{$('#draft-status').textContent='草稿未保存，点击输入框后会重试';throw error});
}
function hideComposer(){saveDraft().catch(()=>{});$('#compose').hidden=true;$('#input').blur();regions()}
async function quitPet(){try{await saveDraft();native('quit')}catch(e){speak('草稿还没保存，稍后再试一次退出。','gentle')}}

window.addEventListener?.('blur',dismissTransientUI);
$('#input').addEventListener('compositionstart',()=>{imeActive=true});
$('#input').addEventListener('compositionend',()=>{imeActive=false;imeEndedAt=Date.now()});
$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&YeliInput.composing(e,imeActive,imeEndedAt,Date.now()))imeEnterUntil=Date.now()+100});
$('#input').addEventListener('focus',()=>{if(inputTouched)saveDraft().catch(()=>{})});
document.addEventListener('keydown',e=>{
 if(e.key!=='Escape'||YeliInput.composing(e,imeActive,imeEndedAt,Date.now()))return;

 else if(!$('#panel').hidden){panelGeneration++;$('#panel').hidden=true}

});
function syncGameMode(){
 const enabled=!!state?.settings?.game_mode;

 if(appliedGameMode!==enabled){native('gameMode',{enabled});appliedGameMode=enabled;if(typeof stopVoice==='function')stopVoice();if(enabled){clearInterval(typing);typing=null;clearTimeout(fold);$('#bubble').hidden=true;$('#dot').hidden=true;pending=null;$('#memory').hidden=true}}
}
async function toggleGameMode(){

 try{await api('runtime',{action:'apply',config:{game_mode:!state.settings.game_mode}});await refresh();$('#menu').hidden=true;regions()}

}
$('#game-mode-toggle').onclick=toggleGameMode;
async function refresh(){state=await api('state');$('#speaker-name').textContent=state.settings.name||'夜璃';$('#compose-name').textContent=state.settings.name||'夜璃';setScale(state.settings.scale||1);if(typeof reconcileRuntime==='function')reconcileRuntime();syncGameMode();if(typeof reconcileReminders==='function')reconcileReminders()}
function setScale(v){

 const desired=100+280*effective+12,bottom=desired<=height-137?desired:Math.max(90,height-200);
 $('#bubble').style.bottom=bottom+'px';$('#reminder').style.bottom=bottom+'px';$('#dot').style.bottom=Math.min(100+280*effective+5,height-45)+'px';

}
window.addEventListener?.('resize',()=>setScale(scale));
function handleDisplayChange(side){
 const pointer=down?.pointerId;down=null;moved=false;
 if(pointer!==undefined){try{pet.releasePointerCapture(pointer)}catch(e){}}
 clearTimeout(inviteTimer);waiting=false;native('endPeek');pet.className='';setDock(side);setScale(scale);
 if(typeof petMotion==='function'&&['held','fall','land'].includes(currentMotion))petMotion('land');
}
function setDock(side){dock=side;document.body.className=side?'docked '+side:'';if(side){$('#dot').hidden=true;$('#compose').hidden=true;$('#bubble').hidden=true}regions()}
function act(kind){pet.className=kind;setTimeout(()=>{if(!waiting)pet.className=''},2800)}
function interacted(){if(typeof interruptReminder==='function')interruptReminder();if(typeof wakePet==='function')wakePet();last=Date.now();attempts=0;waiting=false;invitationGeneration++;persistSchedule().catch(()=>{});clearTimeout(inviteTimer);native('endPeek');pet.className=''}
function finish(){if(typeof finishSpeechMotion==='function')finishSpeechMotion(replyEmotion);else if(typeof petMotion==='function'&&currentMotion==='talk')act(replyEmotion);clearInterval(typing);typing=null;$('#speech').textContent=full;if(!pending){clearTimeout(fold);fold=setTimeout(()=>{if(!$('#bubble').matches(':hover'))foldBubble();else $('#bubble').onmouseleave=foldBubble},Math.max(9000,full.length*100))}}
function foldBubble(){if(pending)return;$('#bubble').hidden=true;$('#dot').hidden=false;regions()}
function speak(text,emotion='idle',memory=null){if(state?.settings?.game_mode){if(typeof interruptReminder==='function')interruptReminder();clearTimeout(fold);clearInterval(typing);typing=null;full=text;replyEmotion=emotion;pending=null;$('#bubble').hidden=true;$('#dot').hidden=true;$('#memory').hidden=true;if(typeof beginSpeechMotion==='function')beginSpeechMotion();if(typeof playVoice==='function')playVoice(text,true);regions();return}if(typeof playVoice==='function'&&state?.settings?.voice_normal_chat)playVoice(text);if(typeof interruptReminder==='function')interruptReminder();clearTimeout(fold);clearInterval(typing);$('#bubble').onmouseleave=null;full=text;replyEmotion=emotion;pending=memory;$('#fold-reply').disabled=!!memory;$('#bubble-content').scrollTop=0;$('#speech').textContent='';$('#dot').hidden=true;$('#bubble').hidden=false;$('#memory').replaceChildren();$('#memory').hidden=!memory;if(memory){let caption=document.createElement('div');caption.className='memory-caption';caption.textContent='留在记忆里？';$('#memory').append(caption);let t=document.createElement('div');t.textContent=memory;$('#memory').append(t);for(const [label,save] of [['记住',true],['这次不记',false]]){let b=document.createElement('button');b.textContent=label;b.onclick=async e=>{e.stopPropagation();try{if(save)await api('memory',{content:memory});pending=null;$('#fold-reply').disabled=false;$('#memory').hidden=true;finish()}catch(e){b.textContent='未保存，点击重试'}};$('#memory').append(b)}}let i=0;typing=setInterval(()=>{i++;$('#speech').textContent=full.slice(0,i);if(i>=full.length)finish()},35);if(typeof beginSpeechMotion==='function')beginSpeechMotion();else if(typeof petMotion==='function'&&!['held','fall','land'].includes(currentMotion))petMotion('talk');regions()}
$('#fold-reply').onclick=e=>{e.stopPropagation();if(pending)return;if(typing)finish();foldBubble()};
$('#bubble').onclick=()=>{if(typing)finish()};$('#dot').onclick=()=>{interacted();$('#bubble').hidden=false;$('#dot').hidden=true;finish()};
async function send(proactive=false){
 if(busy)return;
 const text=$('#input').value.trim();if(!proactive&&!text)return;

}
$('#cancel').onclick=async()=>{

 try{await api('cancel',{request_id:request.id});request.cancelled=true;request.controller.abort()}
 catch(e){speak('暂时没能取消，请再试一次。','gentle')}
 finally{$('#cancel').disabled=false}
