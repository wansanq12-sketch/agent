name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main, yeli-windows-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-windows.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-windows.txt "pyinstaller>=6.17,<7"
      - name: Generate Windows version metadata
        run: python tools/windows_version.py
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean Yeli-Windows.spec
      - name: Test bundled assets, OCR and API
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/Yeli.exe -ArgumentList '--self-test', 'dist/self-test.json' -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content dist/self-test.json; throw 'EXE self-test failed' }
          $report = Get-Content dist/self-test.json -Raw | ConvertFrom-Json
          if (-not $report.ok -or -not $report.frozen) { throw 'Self-test did not validate a frozen EXE' }
      - name: Build versioned Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (-not (Test-Path $compiler)) {
            $compiler = @(Get-ChildItem -Path "${env:ProgramFiles(x86)}/Inno Setup */ISCC.exe", "$env:ProgramFiles/Inno Setup */ISCC.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1).FullName
          }
          if (-not $compiler -or -not (Test-Path $compiler)) { throw 'Inno Setup compiler not found' }
          "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $version = (Get-Content VERSION -Raw).Trim()
          & $compiler "/DAppVersion=$version" installer/Yeli.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Test installation, upgrade and preserved data
        shell: pwsh
        run: ./tools/test_windows_installer.ps1 -Compiler $env:INNO_COMPILER
      - name: Write release manifest and checksums
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $installer = Get-Item "dist/Yeli-Setup-$version-x64.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          @{version=$version; installer=$installer.Name; sha256=$hash; commit=$env:GITHUB_SHA; data_version=1} | ConvertTo-Json | Set-Content -Encoding utf8 dist/release.json
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Yeli-Windows-Installer
          path: |
            dist/Yeli-Setup-*-x64.exe
            dist/release.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-build-diagnostics
          path: |
            dist/self-test.json
            dist/installed-self-test.json
            dist/installer-test.json
            dist/install-*.log
            build/Yeli-Windows/warn-Yeli-Windows.txt
          if-no-files-found: ignore
